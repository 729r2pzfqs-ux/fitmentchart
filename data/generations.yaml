# Used to (a) label each model-year page and (b) let 04_ankusi_wheels.py carry
# a bolt pattern / centre bore across a generation when every source row inside
# that generation agrees. Overlapping years are real: two generations were sold
# side by side (2007 Silverado "Classic", 2019 Silverado LD, 2018 Wrangler JK,
# 2019-24 Ram 1500 Classic).
# `end: null` means still in production.

